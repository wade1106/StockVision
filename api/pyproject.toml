[project]
name = "stockvision"
version = "0.1.0"
description = "台股每日收盤後自動分析與 LINE 推播系統"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "pandas-market-calendars>=4.3.0",
    "pyarrow>=14.0.0",
    "ta-lib>=0.4.28",
    "lightgbm>=4.3.0",
    "shap>=0.44.0",
    "anthropic>=0.26.0",
    "line-bot-sdk>=3.11.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pip-system-certs>=5.3",
    "lxml>=6.1.0",
    "html5lib>=1.1",
    "beautifulsoup4>=4.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
